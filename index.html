<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabutan Bertuah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1a0b3d;
    --bg2: #3b0f5c;
    --gold: #ffd54a;
    --gold-dark: #e0a800;
    --pink: #ff4fa3;
    --text: #fff;
    --muted: rgba(255,255,255,.65);
    --panel: #1f1240;
    --card: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.15);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%) fixed;
    overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* latar bintang berkelip */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .stars span {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; opacity: .2; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 50% { opacity: 1; transform: scale(1.6); } }

  /* butang gear */
  .gear-btn, .fs-btn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(6px); transition: transform .4s, background .2s;
  }
  .gear-btn:hover { transform: rotate(90deg); background: rgba(255,255,255,.18); }
  .gear-btn svg, .fs-btn svg { width: 24px; height: 24px; }
  .fs-btn { right: 76px; }
  .fs-btn[hidden] { display: none; }
  .fs-btn:hover { transform: scale(1.1); background: rgba(255,255,255,.18); }
  .fs-btn .exit, .fs-btn.active .enter { display: none; }
  .fs-btn.active .exit { display: block; }

  main {
    position: relative; z-index: 1; width: 100%; max-width: 1100px;
    padding: 72px 16px 40px; display: flex; flex-direction: column; align-items: center;
    flex: 1;
  }
  h1 {
    margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; text-align: center;
    background: linear-gradient(90deg, var(--gold), var(--pink), var(--gold));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .subtitle { color: var(--muted); margin: 6px 0 28px; text-align: center; }
  .subtitle b { color: var(--gold); }

  /* kawasan paparan */
  .stage {
    width: 100%; min-height: 220px;
    display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: stretch;
    padding: 24px; border-radius: 24px;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 0 60px rgba(255,79,163,.15) inset;
  }
  .placeholder { color: var(--muted); font-size: 1.2rem; text-align: center; }
  .slot {
    width: 100%; min-height: 64px;
    display: flex; flex-direction: row; align-items: center; gap: 18px;
    padding: 12px 20px; border-radius: 14px; text-align: left;
    background: linear-gradient(160deg, #2c1763, #1a0d3d);
    border: 2px solid rgba(255,213,74,.35);
    position: relative; overflow: hidden;
  }
  .slot .no {
    flex: none; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 999px;
    display: grid; place-items: center; font-weight: 800; font-size: 1.1rem;
    background: rgba(255,213,74,.15); color: var(--gold); border: 1px solid rgba(255,213,74,.4);
  }
  .slot.win .no { background: var(--gold); color: #3b1600; }
  .slot .name {
    flex: 1; min-width: 0; font-size: clamp(1.1rem, 2.6vw, 1.8rem); font-weight: 800; line-height: 1.25;
    word-break: break-word;
  }
  /* satu pemenang: paparan besar di tengah */
  .slot:only-child { justify-content: center; text-align: center; min-height: 140px; }
  .slot:only-child .no { display: none; }
  .slot:only-child .name { flex: none; font-size: clamp(1.6rem, 5vw, 3rem); }
  .slot.spinning .name { filter: blur(1.2px); opacity: .85; }
  .slot.spinning { animation: shake .12s infinite; }
  @keyframes shake { 50% { transform: translateY(2px); } }
  .slot.win {
    border-color: var(--gold);
    box-shadow: 0 0 30px rgba(255,213,74,.6), 0 0 80px rgba(255,79,163,.3);
    animation: pop .6s cubic-bezier(.2,1.6,.4,1);
  }
  .slot.win .name { color: var(--gold); text-shadow: 0 0 18px rgba(255,213,74,.7); }
  .slot.win::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform: translateX(-100%); animation: sweep 1.2s .2s ease-out forwards;
  }
  @keyframes pop { 0% { transform: scale(.92); } 100% { transform: scale(1); } }
  @keyframes sweep { to { transform: translateX(100%); } }

  /* butang cabut */
  .draw-btn {
    margin-top: 32px; padding: 18px 64px; font: 800 1.5rem 'Poppins', sans-serif;
    letter-spacing: .08em; color: #3b1600; cursor: pointer; border: none; border-radius: 999px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dark));
    box-shadow: 0 8px 0 #9c6b00, 0 12px 30px rgba(255,213,74,.4);
    transition: transform .1s, box-shadow .1s, filter .2s;
    animation: pulse 2s infinite;
  }
  .draw-btn:hover { filter: brightness(1.08); }
  .draw-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #9c6b00, 0 4px 14px rgba(255,213,74,.4); }
  .draw-btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 8px 0 #9c6b00, 0 12px 50px rgba(255,213,74,.75); } }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 14px; }

  /* sejarah pemenang */
  .history { width: 100%; margin-top: 40px; }
  .history h2 { font-size: 1.1rem; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .history ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .history li {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  }
  .history .round { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .history .time { color: var(--muted); font-size: .8rem; margin-left: auto; }

  /* offcanvas */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .offcanvas {
    position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100%); z-index: 40;
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  .offcanvas.show { transform: translateX(0); }
  .oc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .oc-head h3 { margin: 0; font-size: 1.15rem; }
  .close-btn { background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; line-height: 1; }
  .oc-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }
  .small { color: var(--muted); font-size: .8rem; font-weight: 400; }
  textarea, input[type=number] {
    width: 100%; font: inherit; color: var(--text); background: rgba(0,0,0,.25);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 280px; resize: vertical; line-height: 1.5; }
  textarea:focus, input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .stepper { display: flex; gap: 8px; }
  .stepper button {
    width: 44px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 1.3rem; cursor: pointer;
  }
  .stepper input { text-align: center; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; cursor: pointer; }
  .oc-foot { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .btn {
    padding: 12px; border-radius: 10px; font: 600 1rem 'Poppins', sans-serif; cursor: pointer; border: none;
  }
  .btn-primary { background: var(--gold); color: #3b1600; }
  .btn-ghost { background: transparent; color: #ff8a8a; border: 1px solid rgba(255,138,138,.4); }

  /* toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px); z-index: 50;
    background: #fff; color: #222; padding: 12px 20px; border-radius: 999px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: transform .35s; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; }

  /* sorotan spotlight semasa cabutan */
  body.drawing .stage { box-shadow: 0 0 80px rgba(255,213,74,.35) inset, 0 0 40px rgba(255,79,163,.3); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<canvas id="confetti"></canvas>

<button class="fs-btn" id="fullscreenBtn" aria-label="Skrin penuh" title="Skrin penuh (F)">
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
  </svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
  </svg>
</button>
<button class="gear-btn" id="openSettings" aria-label="Tetapan">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<main>
  <h1>🎉 Cabutan Bertuah 🎉</h1>
  <p class="subtitle"><b id="remaining">0</b> nama dalam senarai · <b id="perDraw">1</b> nama setiap cabutan</p>

  <section class="stage" id="stage">
    <div class="placeholder" id="placeholder">Tekan <b>CABUT</b> untuk mula!</div>
  </section>

  <button class="draw-btn" id="drawBtn">CABUT!</button>
  <div class="hint">atau tekan <b>Space</b></div>

  <section class="history" id="historyWrap" hidden>
    <h2>Senarai Pemenang</h2>
    <ol id="history"></ol>
  </section>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="offcanvas" id="offcanvas" aria-hidden="true">
  <div class="oc-head">
    <h3>⚙️ Tetapan</h3>
    <button class="close-btn" id="closeSettings" aria-label="Tutup">&times;</button>
  </div>
  <div class="oc-body">
    <div>
      <label for="namesInput">Senarai Nama <span class="small">(satu nama setiap baris) · <span id="nameCount">0</span> nama</span></label>
      <textarea id="namesInput" placeholder="Ali&#10;Abu&#10;Siti&#10;..."></textarea>
    </div>
    <div>
      <label for="countInput">Bilangan nama setiap cabutan</label>
      <div class="stepper">
        <button type="button" id="minus">−</button>
        <input type="number" id="countInput" min="1" value="1">
        <button type="button" id="plus">+</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="soundInput" checked> Bunyi kesan</label>
  </div>
  <div class="oc-foot">
    <button class="btn btn-primary" id="saveBtn">Simpan</button>
    <button class="btn btn-ghost" id="clearHistoryBtn">Padam Senarai Pemenang</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY_NAMES = 'cabutan.names';
  const KEY_COUNT = 'cabutan.count';
  const KEY_HISTORY = 'cabutan.history';
  const KEY_SOUND = 'cabutan.sound';

  const $ = id => document.getElementById(id);
  const load = (k, def) => { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let names = load(KEY_NAMES, []);
  let drawCount = load(KEY_COUNT, 1);
  let history = load(KEY_HISTORY, []);
  let soundOn = load(KEY_SOUND, true);
  let drawing = false;

  const parseNames = text => text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const randInt = max => {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max;
  };
  const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- UI ---------- */
  function renderInfo() {
    $('remaining').textContent = names.length;
    $('perDraw').textContent = drawCount;
    $('drawBtn').disabled = drawing || names.length === 0;
  }

  function renderHistory() {
    $('historyWrap').hidden = history.length === 0;
    $('history').innerHTML = history.map((h, i) => `
      <li><span class="round">#${i + 1}</span>
      <span>${h.names.map(escapeHtml).join(', ')}</span>
      <span class="time">${new Date(h.time).toLocaleString('ms-MY')}</span></li>`).reverse().join('');
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2500);
  }

  /* ---------- Offcanvas ---------- */
  function openSettings() {
    if (drawing) return;
    $('namesInput').value = names.join('\n');
    $('countInput').value = drawCount;
    $('soundInput').checked = soundOn;
    $('nameCount').textContent = names.length;
    $('offcanvas').classList.add('show');
    $('offcanvas').setAttribute('aria-hidden', 'false');
    $('backdrop').classList.add('show');
    setTimeout(() => $('namesInput').focus(), 300);
  }
  function closeSettings() {
    $('offcanvas').classList.remove('show');
    $('offcanvas').setAttribute('aria-hidden', 'true');
    $('backdrop').classList.remove('show');
  }
  const isOpen = () => $('offcanvas').classList.contains('show');

  $('openSettings').onclick = openSettings;
  $('closeSettings').onclick = closeSettings;
  $('backdrop').onclick = closeSettings;
  $('namesInput').oninput = e => $('nameCount').textContent = parseNames(e.target.value).length;
  $('minus').onclick = () => $('countInput').value = Math.max(1, (+$('countInput').value || 1) - 1);
  $('plus').onclick = () => $('countInput').value = (+$('countInput').value || 0) + 1;

  $('saveBtn').onclick = () => {
    // buang nama berulang & nama yang sudah menang (abaikan huruf besar/kecil dan ruang berlebihan)
    const norm = s => s.replace(/\s+/g, ' ').toLowerCase();
    const won = new Set(history.flatMap(h => h.names).map(norm));
    const seen = new Set();
    let dupes = 0, winnersRemoved = 0;
    names = parseNames($('namesInput').value).filter(x => {
      const k = norm(x);
      if (won.has(k)) { winnersRemoved++; return false; }
      if (seen.has(k)) { dupes++; return false; }
      seen.add(k); return true;
    });
    $('namesInput').value = names.join('\n');
    $('nameCount').textContent = names.length;

    drawCount = Math.max(1, parseInt($('countInput').value, 10) || 1);
    soundOn = $('soundInput').checked;
    save(KEY_NAMES, names); save(KEY_COUNT, drawCount); save(KEY_SOUND, soundOn);
    renderInfo(); closeSettings();
    const notes = [];
    if (dupes) notes.push(`${dupes} nama berulang`);
    if (winnersRemoved) notes.push(`${winnersRemoved} nama sudah menang`);
    toast(`Disimpan: ${names.length} nama, ${drawCount} setiap cabutan` +
      (notes.length ? ` · dibuang: ${notes.join(', ')}` : ''));
  };

  $('clearHistoryBtn').onclick = () => {
    history = []; save(KEY_HISTORY, history); renderHistory();
    toast('Senarai pemenang dipadam');
  };

  /* ---------- Bunyi (Web Audio) ---------- */
  let audioCtx;
  function beep(freq, dur = .05, type = 'square', vol = .05) {
    if (!soundOn) return;
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .12), i * 120));
  }

  /* ---------- Cabutan ---------- */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function draw() {
    if (drawing || isOpen()) return;
    if (names.length === 0) { toast('Senarai nama kosong. Tambah nama di ⚙️'); return; }

    drawing = true; document.body.classList.add('drawing'); renderInfo();

    const n = Math.min(drawCount, names.length);
    if (n < drawCount) toast(`Hanya ${n} nama tinggal`);

    // pilih pemenang secara rawak (tanpa ulangan)
    const pool = [...names];
    const winners = [];
    for (let i = 0; i < n; i++) winners.push(pool.splice(randInt(pool.length), 1)[0]);

    // bina slot
    const stage = $('stage');
    stage.innerHTML = '';
    const slots = winners.map((_, i) => {
      const el = document.createElement('div');
      el.className = 'slot spinning';
      el.innerHTML = `<div class="no">${i + 1}</div><div class="name">?</div>`;
      stage.appendChild(el);
      return el;
    });

    // animasi kocok: laju di awal, perlahan di akhir; slot berhenti satu demi satu
    const baseDuration = 2200;
    const stagger = 700;
    const start = performance.now();
    const stopped = new Array(n).fill(false);
    let delay = 40;

    while (stopped.includes(false)) {
      const elapsed = performance.now() - start;
      slots.forEach((el, i) => {
        if (stopped[i]) return;
        const stopAt = baseDuration + i * stagger;
        if (elapsed >= stopAt) {
          stopped[i] = true;
          el.classList.remove('spinning');
          el.querySelector('.name').textContent = winners[i];
          void el.offsetWidth; el.classList.add('win');
          beep(880, .15, 'triangle', .1);
          burst(el);
        } else {
          el.querySelector('.name').textContent = names[randInt(names.length)];
        }
      });
      beep(300 + randInt(300), .03);
      // perlahankan berdasarkan masa yang tinggal untuk slot aktif seterusnya
      const nextStop = baseDuration + stopped.indexOf(false) * stagger;
      const remain = nextStop - (performance.now() - start);
      delay = remain < 600 ? Math.min(220, delay * 1.18) : 50;
      await sleep(delay);
    }

    fanfare();
    confettiRain();

    // buang pemenang dari senarai
    // (buang satu kejadian sahaja setiap pemenang, sekiranya ada nama berulang)
    names = [...names];
    winners.forEach(w => names.splice(names.indexOf(w), 1));
    save(KEY_NAMES, names);
    history.push({ names: winners, time: Date.now() });
    save(KEY_HISTORY, history);

    drawing = false; document.body.classList.remove('drawing');
    renderInfo(); renderHistory();
  }

  /* ---------- Skrin penuh ---------- */
  const fsBtn = $('fullscreenBtn');
  const root = document.documentElement;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFullscreen() {
    if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
  function syncFullscreen() {
    const on = !!fsElement();
    fsBtn.classList.toggle('active', on);
    fsBtn.setAttribute('aria-label', on ? 'Keluar skrin penuh' : 'Skrin penuh');
    fsBtn.title = on ? 'Keluar skrin penuh (F)' : 'Skrin penuh (F)';
  }
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.hidden = true;
  fsBtn.onclick = toggleFullscreen;
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);

  $('drawBtn').onclick = draw;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen()) closeSettings();
    if (e.key.toLowerCase() === 'f' && !isOpen() && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFullscreen();
    if ((e.code === 'Space' || e.key === 'Enter') && !isOpen() && document.activeElement.tagName !== 'BUTTON') {
      e.preventDefault(); draw();
    }
  });

  /* ---------- Confetti ---------- */
  const cv = $('confetti'), ctx = cv.getContext('2d');
  let parts = [], raf = null;
  const colors = ['#ffd54a', '#ff4fa3', '#4fd1ff', '#7cff6b', '#ffffff', '#b06bff'];
  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener('resize', resize); resize();

  function spawn(x, y, count, spread, speed) {
    for (let i = 0; i < count; i++) {
      const a = (Math.random() - .5) * spread - Math.PI / 2;
      const v = speed * (.5 + Math.random());
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 10,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        c: colors[randInt(colors.length)], life: 1
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(el) {
    const r = el.getBoundingClientRect();
    spawn(r.left + r.width / 2, r.top + r.height / 2, 60, Math.PI * 1.4, 9);
  }
  function confettiRain() {
    spawn(0, innerHeight * .7, 120, Math.PI / 3, 18);
    parts.slice(-120).forEach(p => { p.vx = Math.abs(p.vx) + 4; });
    spawn(innerWidth, innerHeight * .7, 120, Math.PI / 3, 18);
    parts.slice(-120).forEach(p => { p.vx = -Math.abs(p.vx) - 4; });
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += .25; p.vx *= .99; p.vy *= .99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > innerHeight * .6) p.life -= .008;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.r * 2));
      ctx.restore();
    });
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }

  /* ---------- Bintang latar ---------- */
  const stars = $('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }

  renderInfo(); renderHistory();
})();
</script>
</body>
</html>
